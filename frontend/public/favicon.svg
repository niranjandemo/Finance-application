<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="1.5" />

  <!-- BrainCircuit / AI Financial Core Nodes -->
  <g filter="url(#glow)">
    <!-- Main AI circuit brain nodes -->
    <path d="M26 18 C22 18 18 21 18 26 C16 27 15 30 16 33 C15 36 16 39 18 41 C19 45 23 47 27 46 C29 46 31 45 32 44" 
          stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M26 23 C23 23 21 25 21 28" 
          stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M20 34 C21 37 23 39 26 39" 
          stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- Circuit branches & connection lines -->
    <path d="M32 24 L42 24" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M32 32 L46 32" stroke="url(#iconGrad)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M32 40 L42 40" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Circuit connector nodes (terminal dots) -->
    <circle cx="44" cy="24" r="2.2" fill="#38bdf8" />
    <circle cx="48" cy="32" r="2.5" fill="#60a5fa" />
    <circle cx="44" cy="40" r="2.2" fill="#818cf8" />
    
    <!-- Neural core center node -->
    <circle cx="28" cy="32" r="3" fill="#38bdf8" />
  </g>

  <!-- Sparkle Accent in top right -->
  <path d="M47 12 C47 14 49 16 51 16 C49 16 47 18 47 20 C47 18 45 16 43 16 C45 16 47 14 47 12 Z" 
        fill="url(#sparkleGrad)" />
</svg>